name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Drift guards
        shell: bash
        run: ./scripts/check-guards.sh
      - name: Restore
        run: dotnet restore Revolution.slnx
      - name: Build
        run: dotnet build Revolution.slnx --no-restore -c Release
      - name: Test
        run: dotnet test Revolution.slnx --no-build -c Release
