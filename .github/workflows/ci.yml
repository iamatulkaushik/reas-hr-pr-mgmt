name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Drift guards
        shell: bash
        run: ./scripts/check-guards.sh
      # Revolution.ReportViewer is a net481 Crystal Reports helper (COM references, SAP install path).
      # It cannot build on the runner, so CI skips it. Build it locally. See ADR 0005.
      - name: Restore, build, test (ReportViewer excluded)
        shell: bash
        run: |
          set -e
          projects=$(find src tests tools -name '*.vbproj' ! -path '*Revolution.ReportViewer*' | sort)
          for p in $projects; do dotnet restore "$p"; done
          for p in $projects; do dotnet build "$p" --no-restore -c Release; done
          for p in $(find tests -name '*.vbproj' | sort); do dotnet test "$p" --no-build -c Release; done
